[package]
name = "zenodo"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
dotenv = "0.15.0"
uuid = { version = "1", features = ["v4"] }
